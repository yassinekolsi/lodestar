name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Browser speech uses ONNX WASM; CI needs no optional CUDA binaries for Node.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: lodestar
          POSTGRES_PASSWORD: lodestar
          POSTGRES_DB: lodestar
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U lodestar" --health-interval 5s --health-timeout 3s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    env:
      LODESTAR_REQUIRE_DB: "1"
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.19"
      - uses: actions/cache@v6.1.0
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5-bm25
      - run: uv sync --frozen --python 3.14 --extra whisper
      - name: Check Python formatting and types
        run: make lint-backend
      - name: Check study language
        run: make lint-language
      - name: Run backend tests
        run: make test-backend
      - name: Run simulated student thresholds
        run: make sim N=200

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Check frontend formatting and types
        run: make lint-frontend
      - name: Run frontend tests
        run: make test-frontend
      - name: Build the student app
        run: npm run build --prefix frontend

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.19"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --python 3.14 --extra whisper
      - run: npm ci --prefix frontend
      - run: make contracts
      - run: git diff --exit-code
