# Labelled utterances in French and Tunisian Arabic (Derja), routed by the same keyword rules as
# intents.yaml (backend/agent/intents.py, _FR_TN_*). Derja is written the way students type it:
# in Arabic script, in Latin letters with digits ("ma fhemtech", "3awedli"), and mixed with the
# French course terms. `lang` is for reading only; the router doesn't need to be told.

# French: understanding ------------------------------------------------------------------------
- {lang: fr, text: "Je ne comprends pas le théorème de Bayes", kind: chat, tool: teach, dim: bayes}
- {lang: fr, text: "je n'ai pas compris la probabilité conditionnelle", kind: chat, tool: teach, dim: conditional}
- {lang: fr, text: "c'est quoi une variable aléatoire ?", kind: chat, tool: teach, dim: random_variables}
- {lang: fr, text: "Explique-moi l'espérance", kind: chat, tool: teach, dim: expectation}
- {lang: fr, text: "comment on calcule la variance ?", kind: chat, tool: teach, dim: variance}
- {lang: fr, text: "je bloque sur la loi binomiale", kind: chat, tool: teach, dim: binomial}
- {lang: fr, text: "Qu’est-ce que veut dire indépendants ?", kind: chat, tool: teach, dim: independence}

# French: mistakes, why, forecasts, pushback ----------------------------------------------------
- {lang: fr, text: "Qu'est-ce que je rate tout le temps ?", kind: chat, tool: mistakes}
- {lang: fr, text: "quelles erreurs je fais en dénombrement ?", kind: chat, tool: mistakes, dim: counting}
- {lang: fr, text: "Pourquoi tu as choisi mon dernier exercice ?", kind: chat, tool: explain}
- {lang: fr, text: "Quel sera exactement mon score en Bayes le mois prochain ?", kind: chat, tool: forecast_range, dim: bayes}
- {lang: fr, text: "C'est pas juste, il y avait du bruit", kind: chat, tool: contest}
- {lang: fr, text: "je ne suis pas d'accord avec ce résultat", kind: chat, tool: contest}
- {lang: fr, text: "comment je m'en sors ?", kind: chat, tool: read_profile}
- {lang: fr, text: "tu te souviens de ce que je t'ai dit ?", kind: chat, tool: search_memory}

# French: practice ------------------------------------------------------------------------------
- {lang: fr, text: "Interroge-moi sur mes notes", kind: play, game: quiz_notes}
- {lang: fr, text: "Interroge-moi sur la probabilité conditionnelle", kind: play, dim: conditional}
- {lang: fr, text: "Quelque chose de rapide", kind: play, quick: true}
- {lang: fr, text: "pas de dénombrement aujourd'hui", kind: play, avoid: [counting]}
- {lang: fr, text: "play Quiz : Théorème de Bayes", kind: play, game: quiz_bayes}
- {lang: fr, text: "on y va", kind: play}

