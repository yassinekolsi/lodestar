# Labelled utterances for intent routing (WP2.11 "Done when"). Each has the intent kind and, where
# it matters, the slots the router must fill: a named game, a skill, skills turned down, "quick",
# and the converse tool. Written as people type, typos and all. Safety phrasings (diagnosis,
# medical advice, crisis) are in safety.yaml: they never reach the router.

# play ---------------------------------------------------------------------------------------
- {text: "let's play", kind: play}
- {text: "Start a round", kind: play}
- {text: "I'm ready", kind: play}
- {text: "go", kind: play}
- {text: "another one please", kind: play}
- {text: "one more game", kind: play}
- {text: "play Quiz: Conditional probability", kind: play, game: quiz_conditional}
- {text: "can we do Quiz: Sample spaces and events?", kind: play, game: quiz_sample_space}
- {text: "I want to try Quiz: Counting outcomes", kind: play, game: quiz_counting}
- {text: "Quiz: Conditional probability please", kind: play, game: quiz_conditional}
- {text: "let's do Quiz: Expected value", kind: play, game: quiz_expectation}
- {text: "a conditional probability game", kind: play, dim: conditional}
- {text: "something for my sample spaces", kind: play, dim: sample_space}
- {text: "give me a Bayes puzzle", kind: play, dim: bayes}
- {text: "train my reaction equally likely", kind: play, dim: equally_likely}
- {text: "practice counting", kind: play, dim: counting}
- {text: "a game about football", kind: play}
- {text: "something quick", kind: play, quick: true}
- {text: "a short one, I only have 2 minutes", kind: play, quick: true}
- {text: "warm me up", kind: play}
- {text: "challenge me", kind: play}
- {text: "play Quiz: The binomial distribution", kind: play, game: quiz_binomial}

# declining a suggestion (UW3) ----------------------------------------------------------------
- {text: "Not conditional probability today, something quick.", kind: play, avoid: [conditional], quick: true}
- {text: "no conditional probability games please", kind: play, avoid: [conditional]}
- {text: "skip the expectation", kind: play, avoid: [expectation]}
- {text: "anything but bayes", kind: play, avoid: [bayes]}
- {text: "I'm sick of equally likely games", kind: play, avoid: [equally_likely]}
- {text: "something other than sample spaces", kind: play, avoid: [sample_space]}
- {text: "I'd rather not do conditional probability right now", kind: play, avoid: [conditional]}
- {text: "not that one, give me something else", kind: play}

